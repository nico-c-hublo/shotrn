services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shotrn
    ports:
      - '5432:5432'
    volumes:
      - shotrn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d shotrn']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shotrn-pgdata:
